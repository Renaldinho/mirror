<main class="board-surface relative h-screen w-screen overflow-hidden bg-black">
  <!-- botanical background / mirror lighting (fades to pure black when off) -->
  <app-background />

  <!-- controls -->
  <app-widget-grid />
  <app-lighting-control />

  <!-- corner title -->
  <div class="pointer-events-none absolute bottom-4 right-5 z-10 text-right">
    <div class="text-base uppercase tracking-[0.35em] text-gold">La Fleur</div>
    <div class="text-[10px] tracking-[0.25em] text-parchment-dim">a private study</div>
  </div>

  @for (w of dash.widgets(); track w.type) {
    <app-widget-frame [widget]="w" />
  }

  @if (dash.widgets().length === 0) {
    <div class="pointer-events-none absolute inset-0 flex items-center justify-center">
      <p class="text-parchment-dim">Open the cabinet <span class="text-gold">❦</span> and place a widget…</p>
    </div>
  }
</main>
